name: Apply browser profile fix

on:
  push:
    paths:
      - .github/workflows/apply-browser-profile-fix.yml

permissions:
  contents: write

jobs:
  patch-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch launcher
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          s = s.replace(
              "const BROWSER_DEVCONTAINER = '.devcontainer/browser/devcontainer.json';\n  const LEGACY_BROWSER_DEVCONTAINER = '.devcontainer/devcontainer.json';",
              "const BROWSER_DEVCONTAINER = '.devcontainer/browser-v2/devcontainer.json';\n  const LEGACY_BROWSER_DEVCONTAINERS = ['.devcontainer/browser/devcontainer.json', '.devcontainer/devcontainer.json'];"
          )

          s = s.replace(
              "const legacyBrowser = findByDevcontainer(list, LEGACY_BROWSER_DEVCONTAINER);",
              "const legacyBrowser = LEGACY_BROWSER_DEVCONTAINERS.map(path => findByDevcontainer(list, path)).find(Boolean);"
          )

          s = s.replace(
              "const legacy = findByDevcontainer(list, LEGACY_BROWSER_DEVCONTAINER);",
              "const legacy = LEGACY_BROWSER_DEVCONTAINERS.map(path => findByDevcontainer(list, path)).find(Boolean);"
          )

          s = s.replace(
              "findByDevcontainer(list, LEGACY_BROWSER_DEVCONTAINER)\n      ].filter(Boolean);",
              "...LEGACY_BROWSER_DEVCONTAINERS.map(path => findByDevcontainer(list, path))\n      ].filter(Boolean);"
          )

          p.write_text(s)

      - name: Commit launcher patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Use persistent Chromium profile"
            git push
          fi
