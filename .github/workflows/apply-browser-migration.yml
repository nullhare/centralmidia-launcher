name: Apply browser migration

on:
  push:
    paths:
      - .github/workflows/apply-browser-migration.yml

permissions:
  contents: write

jobs:
  patch-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch launcher
        run: |
          echo '' | base64 -d > /tmp/patch_launcher.py
          python /tmp/patch_launcher.py
      - name: Commit launcher patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Make Chromium migration automatic"
            git push
          fi
