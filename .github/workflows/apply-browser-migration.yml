name: Apply browser migration

on:
  push:
    paths:
      - .github/workflows/apply-browser-migration.yml

permissions:
  contents: write

jobs:
  patch-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch launcher without changing its visual layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          s = s.replace(
              "const BROWSER_DEVCONTAINER = '.devcontainer/devcontainer.json';\n  const COMPUTER_DEVCONTAINER = '.devcontainer/computer/devcontainer.json';",
              "const BROWSER_DEVCONTAINER = '.devcontainer/browser/devcontainer.json';\n  const LEGACY_BROWSER_DEVCONTAINER = '.devcontainer/devcontainer.json';\n  const COMPUTER_DEVCONTAINER = '.devcontainer/computer/devcontainer.json';"
          )
          s = s.replace(
              'codespaces=read&codespaces_lifecycle_admin=write&codespaces_metadata=read',
              'codespaces=write&codespaces_lifecycle_admin=write&codespaces_metadata=read'
          )

          old_refresh = '''async function refreshConfig() {
            if (!getToken()) {
              setStatus('● Token do GitHub não configurado', 'bad');
              setPcStatus('● Token do GitHub não configurado', 'bad');
              return;
            }

            setStatus('Configurado neste navegador', 'good');
            setPcStatus('Verificando Codespace do computador…');
            try {
              const list = await listCodespaces();
              const pc = findByDevcontainer(list, COMPUTER_DEVCONTAINER);
              setPcStatus(
                pc ? 'Computador configurado no Codespace' : '● Falta criar o Codespace do computador',
                pc ? 'good' : 'bad'
              );
            } catch (_) {
              setPcStatus('● Não foi possível verificar o computador', 'bad');
            }
          }'''

          new_refresh = '''async function refreshConfig() {
            if (!getToken()) {
              setStatus('● Token do GitHub não configurado', 'bad');
              setPcStatus('● Token do GitHub não configurado', 'bad');
              return;
            }

            setStatus('Verificando navegador…');
            setPcStatus('Verificando Codespace do computador…');
            try {
              const list = await listCodespaces();
              const browser = findByDevcontainer(list, BROWSER_DEVCONTAINER);
              const legacyBrowser = findByDevcontainer(list, LEGACY_BROWSER_DEVCONTAINER);
              const pc = findByDevcontainer(list, COMPUTER_DEVCONTAINER);

              setStatus(
                browser ? 'Chromium configurado no Codespace' : (legacyBrowser ? 'Chromium será preparado ao abrir' : 'Chromium será criado ao abrir'),
                browser ? 'good' : ''
              );
              setPcStatus(
                pc ? 'Computador configurado no Codespace' : '● Falta criar o Codespace do computador',
                pc ? 'good' : 'bad'
              );
            } catch (_) {
              setStatus('● Não foi possível verificar o navegador', 'bad');
              setPcStatus('● Não foi possível verificar o computador', 'bad');
            }
          }'''

          if old_refresh not in s:
              raise SystemExit('refreshConfig block not found')
          s = s.replace(old_refresh, new_refresh)

          marker = "  async function openSpace(path, title, description, setState, openConfigOnMissing = false) {"
          create_browser = '''  async function createBrowserSpace(setState) {
            const list = await listCodespaces();
            const existing = findByDevcontainer(list, BROWSER_DEVCONTAINER);
            if (existing) return existing;

            const legacy = findByDevcontainer(list, LEGACY_BROWSER_DEVCONTAINER);
            if (legacy?.state === 'Available') {
              setState('Desligando navegador antigo…');
              await api(legacy.stop_url, { method:'POST' });
            }

            setState('Criando Chromium…');
            let created;
            try {
              created = await api(REPO_API, {
                method:'POST',
                headers:{ 'Content-Type':'application/json' },
                body:JSON.stringify({
                  ref:'main',
                  devcontainer_path:BROWSER_DEVCONTAINER,
                  display_name:'Navegador remoto'
                })
              });
            } catch (err) {
              if (/GitHub 403/.test(err.message)) {
                throw new Error('O token salvo não tem permissão para criar o novo Codespace Chromium.');
              }
              throw err;
            }

            if (created?.name) return created;

            const deadline = Date.now() + 60000;
            while (Date.now() < deadline) {
              await sleep(2500);
              const space = await getSpace(BROWSER_DEVCONTAINER);
              if (space) return space;
            }
            throw new Error('O GitHub não concluiu a criação do Codespace Chromium.');
          }

'''
          if marker not in s:
              raise SystemExit('openSpace marker not found')
          s = s.replace(marker, create_browser + marker, 1)

          old_space = '''      setState('Localizando Codespace…');
              const space = await getSpace(path);
              if (!space) {
                if (openConfigOnMissing) pcConfigCard.open = true;
                throw new Error('Codespace do computador ainda não foi criado.');
              }
              const ready = await waitAvailable(space, setState);'''

          new_space = '''      setState('Localizando Codespace…');
              let space = await getSpace(path);
              if (!space && path === BROWSER_DEVCONTAINER) {
                space = await createBrowserSpace(setState);
              }
              if (!space) {
                if (openConfigOnMissing) pcConfigCard.open = true;
                throw new Error('Codespace do computador ainda não foi criado.');
              }
              const ready = await waitAvailable(space, setState);'''

          if old_space not in s:
              raise SystemExit('openSpace body not found')
          s = s.replace(old_space, new_space, 1)

          old_stop = '''  async function stopBrowser(openConfig = true) {
            return stopSpace(BROWSER_DEVCONTAINER, setStatus, openConfig);
          }'''

          new_stop = '''  async function stopBrowser(openConfig = true) {
            if (!getToken()) {
              ghConfigCard.open = true;
              setStatus('● Token do GitHub não configurado', 'bad');
              return false;
            }
            try {
              setStatus('Localizando Codespace…');
              const list = await listCodespaces();
              const spaces = [
                findByDevcontainer(list, BROWSER_DEVCONTAINER),
                findByDevcontainer(list, LEGACY_BROWSER_DEVCONTAINER)
              ].filter(Boolean);

              if (!spaces.length) {
                setStatus('Codespace do navegador ainda não foi criado.');
                restoreConfigStatus();
                return false;
              }

              const running = spaces.filter(space => space.state === 'Available');
              if (!running.length) {
                setStatus('Codespace já está desligado ou parando.');
                restoreConfigStatus();
                return true;
              }

              setStatus('Desligando Codespace…');
              await Promise.all(running.map(space => api(space.stop_url, { method:'POST' })));
              setStatus('Codespace desligando.');
              restoreConfigStatus();
              return true;
            } catch (err) {
              setStatus(`● ${err.message}`, 'bad');
              return false;
            }
          }'''

          if old_stop not in s:
              raise SystemExit('stopBrowser block not found')
          s = s.replace(old_stop, new_stop)

          p.write_text(s)
          PY

      - name: Commit launcher patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Make Chromium migration automatic"
            git push
          fi
