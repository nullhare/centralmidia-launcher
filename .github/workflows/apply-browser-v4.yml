name: Apply browser v4

on:
  push:
    paths:
      - .github/workflows/apply-browser-v4.yml

permissions:
  contents: write

jobs:
  patch-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch launcher to browser v4
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "const BROWSER_DEVCONTAINER = '.devcontainer/browser-v3/devcontainer.json';\n  const LEGACY_BROWSER_DEVCONTAINERS = ['.devcontainer/browser-v2/devcontainer.json', '.devcontainer/browser/devcontainer.json', '.devcontainer/devcontainer.json'];"
          new = "const BROWSER_DEVCONTAINER = '.devcontainer/browser-v4/devcontainer.json';\n  const LEGACY_BROWSER_DEVCONTAINERS = ['.devcontainer/browser-v3/devcontainer.json', '.devcontainer/browser-v2/devcontainer.json', '.devcontainer/browser/devcontainer.json', '.devcontainer/devcontainer.json'];"
          if old not in s:
              raise SystemExit('browser v3 constants not found')
          s = s.replace(old, new, 1)
          s = s.replace("display_name:'Navegador remoto'", "display_name:'Navegador Google Chrome'", 1)
          s = s.replace("'Chrome configurado no Codespace'", "'Google Chrome configurado no Codespace'")
          s = s.replace("'Chrome será preparado ao abrir'", "'Google Chrome será preparado ao abrir'")
          s = s.replace("'Chrome será criado ao abrir'", "'Google Chrome será criado ao abrir'")
          p.write_text(s)

      - name: Commit launcher patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use direct Google Chrome browser v4" || exit 0
          git push
