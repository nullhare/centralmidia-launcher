<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Navegador remoto</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #f0f6fc;
    }
    main {
      width: min(520px, 92vw);
      padding: 36px;
      border: 1px solid #30363d;
      border-radius: 18px;
      background: #161b22;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 10px; font-size: 32px; }
    p { margin: 0; color: #8b949e; line-height: 1.5; }
    .button {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 18px 22px;
      border-radius: 12px;
      background: #238636;
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      text-decoration: none;
    }
    .button:hover { background: #2ea043; }
    .note { margin-top: 16px; font-size: 13px; color: #6e7681; line-height: 1.45; }
  </style>
</head>
<body>
  <main>
    <h1>Navegador remoto</h1>
    <p>Abre o GitHub Codespaces em outra aba e mantém este launcher aberto.</p>
    <a class="button" href="https://codespaces.new/nullhare/centralmidia?quickstart=1" target="_blank" rel="noopener noreferrer">ABRIR NAVEGADOR</a>
    <div class="note">Se o Codespace estiver parado, o GitHub pode pedir um clique em <strong>Resume this codespace</strong>.</div>
  </main>
</body>
</html>
